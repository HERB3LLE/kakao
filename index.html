
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title></title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#screen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

#tapArea {
  position: fixed;
  inset: 0;
  z-index: 2;
  touch-action: manipulation;
}
</style>
</head>

<body>
<img id="screen" src="3011B76C-C4E4-46FE-A859-D61A7E3FFC5B.jpeg" alt="">
<div id="tapArea"></div>

<script>
const screen = document.getElementById("screen");
const tapArea = document.getElementById("tapArea");

let changed = false;

const secondPhoto = new Image();
secondPhoto.src = "photo-output.jpeg";

function changePhoto() {
  if (changed) return;
  changed = true;
  screen.src = secondPhoto.src;
}

tapArea.addEventListener("click", changePhoto);
tapArea.addEventListener("touchend", function(e) {
  e.preventDefault();
  changePhoto();
}, { passive: false });
</script>
</body>
</html>
