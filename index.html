
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title></title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

#lock {
  position: fixed;
  inset: 0;
  overflow: hidden;
  color: white;
}

#bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.16),
    transparent 35%,
    transparent 75%,
    rgba(0,0,0,.08)
  );
  pointer-events: none;
}

/* 상단 상태 표시줄 */
.status {
  position: absolute;
  top: max(44px, calc(env(safe-area-inset-top) + 12px));
  left: 13.5%;
  right: 9%;
  height: 27px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
  font-weight: 600;
  text-shadow: 0 1px 3px #333;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 2px;
}

.status-right svg {
  transform: scale(.72);
  transform-origin: center;
}

.bars {
  height: 19px;
  display: flex;
  align-items: end;
  gap: 2px;
  transform: scale(.85);
  transform-origin: center;
}

.bars i {
  width: 3px;
  border-radius: 3px;
  background: white;
}

.bars i:nth-child(1) { height: 7px; }
.bars i:nth-child(2) { height: 10px; }
.bars i:nth-child(3) { height: 14px; }
.bars i:nth-child(4) { height: 18px; }

/* 날짜: 기존 설정 그대로 */
.date {
  position: absolute;
  top: 9.65%;
  width: 100%;
  text-align: center;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -.6px;
  color: rgba(255,255,255,.98);
  opacity: 1;
  -webkit-text-stroke: .25px white;
  text-shadow: 0 1px 3px rgba(0,0,0,.3);
}

/* 시간: 조금 더 두껍고 불투명하게 */
.clock {
  position: absolute;
  top: 12.6%;
  left: 0;
  width: 100%;
  text-align: center;
  white-space: nowrap;
  font-size: clamp(105px, 24vw, 165px);
  line-height: 1.05;
  letter-spacing: -7px;
  font-weight: 350;
  color: rgba(240,238,230,.96);
  -webkit-text-stroke: 1.2px rgba(255,255,255,.5);
  text-shadow:
    0 2px 2px rgba(0,0,0,.4),
    0 -1px 1px rgba(255,255,255,.35);
}

/* 하단 버튼 */
.controls {
  position: absolute;
  left: 11.5%;
  right: 11.5%;
  bottom: calc(max(8px, env(safe-area-inset-bottom)) + 49px);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.circle {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(35,35,35,.48);
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: inset 0 0 1px rgba(255,255,255,.25);
  backdrop-filter: blur(12px);
}

.circle svg {
  width: 27px;
  height: 27px;
}

.camera {
  background: rgba(255,255,255,.68);
}

/* 맨 아래 흰색 막대 */
.homebar {
  position: absolute;
  left: 50%;
  bottom: max(9px, calc(env(safe-area-inset-bottom) + 5px));
  transform: translateX(-50%);
  width: 135px;
  height: 5px;
  background: #fff;
  border-radius: 10px;
}

#tap {
  position: absolute;
  inset: 0;
  z-index: 5;
  touch-action: manipulation;
  cursor: pointer;
}

/* 터치 후 나타나는 사진 */
#second {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  background: #000;
}
</style>
</head>

<body>

<div id="lock">
  <img id="bg"
       src="3011B76C-C4E4-46FE-A859-D61A7E3FFC5B.jpeg"
       alt="">

  <div class="overlay"></div>

  <div class="status">
    <span style="display:flex;align-items:center;gap:5px">
      KT
      <svg width="19" height="19" viewBox="0 0 24 24" fill="white">
        <path d="M3 2 2 3l4 4v9a3 3 0 0 0 3 3h3l3 3 1-1L3 2z"/>
        <path d="M9 3h6l3 4v9l-2 2-2-2h-2l-2-2V7z"/>
      </svg>
    </span>

    <div class="status-right">
      <div class="bars">
        <i></i><i></i><i></i><i></i>
      </div>

      <svg width="25" height="20" viewBox="0 0 30 23"
           fill="none" stroke="white" stroke-width="3.5"
           stroke-linecap="round">
        <path d="M2 7Q15 -3 28 7"/>
        <path d="M7 12Q15 5 23 12"/>
        <path d="M12 17Q15 14 18 17"/>
      </svg>

      <svg width="40" height="21" viewBox="0 0 49 25">
        <rect x="1" y="2" width="42" height="21" rx="5"
              fill="white" fill-opacity=".9"/>
        <rect x="4" y="5" width="28" height="15" rx="2"
              fill="#aaa"/>
        <path d="M45 8v9q3-1 3-4.5T45 8" fill="white"/>
      </svg>
    </div>
  </div>

  <div class="date">Fri Oct 30</div>
  <div class="clock">08:08</div>

  <div class="controls">
    <div class="circle">
      <svg viewBox="0 0 32 32" fill="white">
        <path d="M12 3h8l2 5H10z"/>
        <rect x="9" y="8" width="14" height="21" rx="3"/>
        <path d="m16 11-4 9h4l-1 6 5-10h-4z" fill="#555"/>
      </svg>
    </div>

    <div class="circle camera">
      <svg viewBox="0 0 32 32" fill="white">
        <path d="M5 9h6l2-3h7l2 3h5v17H5z"/>
        <circle cx="16" cy="17" r="6" fill="#ccc"/>
        <circle cx="16" cy="17" r="4" fill="white"/>
      </svg>
    </div>
  </div>

  <div class="homebar"></div>
  <div id="tap"></div>
</div>

<img id="second" src="photo-output.jpeg" alt="">

<script>
const lock = document.getElementById("lock");
const second = document.getElementById("second");
const tap = document.getElementById("tap");

let changed = false;

// 두 번째 사진 미리 불러오기
const preload = new Image();
preload.src = "photo-output.jpeg";

function reveal() {
  if (changed) return;

  changed = true;
  second.style.display = "block";
  lock.style.display = "none";
}

tap.addEventListener("click", reveal);

tap.addEventListener("touchend", function(e) {
  e.preventDefault();
  reveal();
}, { passive: false });
</script>

</body>
</html>
